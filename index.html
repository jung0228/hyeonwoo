<!DOCTYPE html><!-- v4 -->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>정현우의 AI/ML 지식 지도</title>
  <meta name="description" content="AI/ML 개념 간 연결을 시각화하고 복습 현황을 추적하는 개인 지식 관리 사이트" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- D3.js -->
  <script src="vendor/d3.v7.min.js"></script>
  <!-- marked.js for Markdown -->
  <script src="vendor/marked.min.js"></script>
  <!-- KaTeX for Math -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false}
      ]
    })"></script>

  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
  <!-- Header -->
  <header class="header" id="header">
    <div class="header-left">
      <div class="logo">
        <span class="logo-icon">🧠</span>
        <span class="logo-text">정현우의 지식 지도</span>
      </div>
      <nav class="nav" id="nav">
        <button class="nav-btn active" id="btn-graph" data-view="graph">
          <span class="nav-icon">🌐</span> Knowledge Graph
        </button>
        <button class="nav-btn" id="btn-heatmap" data-view="heatmap">
          <span class="nav-icon">🗓️</span> Activity
        </button>
        <button class="nav-btn" id="btn-progress" data-view="progress">
          <span class="nav-icon">📊</span> Progress
        </button>
      </nav>
    </div>
    <div class="header-right">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="개념 검색..." autocomplete="off" />
      </div>
      <div class="stats-badge" id="stats-badge">
        <span id="total-nodes">0</span> 개념
      </div>
    </div>
  </header>

  <!-- Main Layout -->
  <main class="main" id="main">

    <!-- ===== VIEW: GRAPH ===== -->
    <div class="view active" id="view-graph">
      <div class="graph-container" id="graph-container">
        <!-- Graph Legend -->
        <div class="legend" id="legend">
          <div class="legend-title">카테고리</div>
          <!-- populated by JS -->
        </div>

        <!-- Confidence Legend -->
        <div class="confidence-legend">
          <div class="confidence-legend-title">자신감</div>
          <div class="confidence-legend-items">
            <span class="cl-item"><span class="cl-dot" style="opacity:0.25"></span> 모름</span>
            <span class="cl-item"><span class="cl-dot" style="opacity:0.5"></span> 기초</span>
            <span class="cl-item"><span class="cl-dot" style="opacity:0.75"></span> 중급</span>
            <span class="cl-item"><span class="cl-dot" style="opacity:1"></span> 심화</span>
          </div>
        </div>

        <!-- Graph Controls -->
        <div class="graph-controls">
          <button class="ctrl-btn" id="btn-zoom-in" title="확대">+</button>
          <button class="ctrl-btn" id="btn-zoom-out" title="축소">−</button>
          <button class="ctrl-btn" id="btn-zoom-reset" title="초기화">⊙</button>
        </div>

        <!-- D3 SVG -->
        <svg id="graph-svg"></svg>

        <!-- Tooltip -->
        <div class="node-tooltip" id="node-tooltip"></div>
      </div>

      <!-- Note Panel -->
      <div class="note-panel" id="note-panel">
        <div class="note-panel-header">
          <div class="note-panel-title" id="note-panel-title">개념을 클릭하세요</div>
          <div class="note-panel-meta" id="note-panel-meta"></div>
          <button class="note-close" id="note-close">×</button>
        </div>
        <div class="note-panel-body" id="note-panel-body">
          <div class="note-placeholder">
            <div class="note-placeholder-icon">👆</div>
            <p>그래프에서 개념 노드를 클릭하면<br />여기에 노트가 표시됩니다.</p>
            <p class="note-placeholder-hint">엣지(선)에는 개념 간 연결 인사이트가 있어요!</p>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== VIEW: HEATMAP ===== -->
    <div class="view" id="view-heatmap">
      <div class="heatmap-page">
        <div class="page-header">
          <h1 class="page-title">학습 활동 기록</h1>
          <p class="page-subtitle">언제 어떤 주제를 공부했는지 시각화</p>
        </div>

        <!-- Heatmap Grid -->
        <div class="heatmap-wrapper">
          <div class="heatmap-months" id="heatmap-months"></div>
          <div class="heatmap-grid-area">
            <div class="heatmap-days">
              <span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span>Sun</span>
            </div>
            <div class="heatmap-grid" id="heatmap-grid"></div>
          </div>
          <div class="heatmap-legend-row">
            <span class="heatmap-legend-label">적음</span>
            <div class="heatmap-legend-cells">
              <div class="heatmap-cell" style="--intensity: 0"></div>
              <div class="heatmap-cell" style="--intensity: 1"></div>
              <div class="heatmap-cell" style="--intensity: 2"></div>
              <div class="heatmap-cell" style="--intensity: 3"></div>
              <div class="heatmap-cell" style="--intensity: 4"></div>
            </div>
            <span class="heatmap-legend-label">많음</span>
          </div>
        </div>

        <!-- Recent Sessions -->
        <div class="sessions-section">
          <h2 class="section-title">최근 학습 세션</h2>
          <div class="sessions-list" id="sessions-list"></div>
        </div>

        <!-- Category Heatmap -->
        <div class="category-activity-section">
          <h2 class="section-title">주제별 학습 빈도</h2>
          <div class="category-bars" id="category-bars"></div>
        </div>
      </div>
    </div>

    <!-- ===== VIEW: PROGRESS ===== -->
    <div class="view" id="view-progress">
      <div class="progress-page">
        <div class="page-header">
          <h1 class="page-title">학습 진도</h1>
          <p class="page-subtitle">주제별 자신감 레벨과 학습 완료율</p>
        </div>

        <!-- Summary Cards -->
        <div class="summary-cards" id="summary-cards"></div>

        <!-- Category Progress -->
        <div class="category-progress-section">
          <h2 class="section-title">카테고리별 진도</h2>
          <div class="category-progress-list" id="category-progress-list"></div>
        </div>

        <!-- Weak Spots -->
        <div class="weak-spots-section">
          <h2 class="section-title">🔴 보완이 필요한 개념</h2>
          <p class="section-desc">자신감 레벨이 낮은 개념들 — 집중 복습 추천!</p>
          <div class="weak-spots-list" id="weak-spots-list"></div>
        </div>

        <!-- Strong Concepts -->
        <div class="strong-section">
          <h2 class="section-title">🟢 강점 개념</h2>
          <div class="strong-list" id="strong-list"></div>
        </div>
      </div>
    </div>

  </main>

  <!-- Search Results Dropdown -->
  <div class="search-results" id="search-results"></div>

  <script src="app.js?v=4"></script>
</body>
</html>
